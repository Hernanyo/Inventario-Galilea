site_name: Inventario Galilea
site_description: Documentación del sistema de inventario y mantenciones
site_author: Equipo Galilea

repo_url: https://github.com/Hernanyo/Inventario-Galilea
repo_name: Hernanyo/Inventario-Galilea
edit_uri: ""

theme:
  name: material
  language: es
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - content.code.copy
    - content.tabs.link
    - toc.follow
    - search.suggest
    - search.highlight
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-6
        name: Cambiar tema

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: ["."]
          options:
            show_source: true
            docstring_style: google
            separate_signature: true
            show_if_no_docstring: true
            filters:
              - "!^_"

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - toc:
      permalink: true

nav:
  - Inicio: index.md
  - Guía Rápida:
      - Instalación: getting-started/instalacion.md
      - Configuración: getting-started/configuracion.md
  - Manual de Usuario:
      - Activos: user/activos.md
      - Mantenciones: user/mantenciones.md
  - Arquitectura:
      - Visión General: architecture/overview.md
      - Modelo de Datos: architecture/data-model.md
  - API (Código):
      - CRUD Genérico: api/crud.md
      - Modelos de Inventario: api/models_inventario.md
  - Cambios: changelog.md
  - FAQ: faq.md

