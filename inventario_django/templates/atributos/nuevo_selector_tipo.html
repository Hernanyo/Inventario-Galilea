{% extends "base.html" %}
{% block title %}Nuevo atributos de activo{% endblock %}

{% block content %}
<div class="container mt-3">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h4 mb-0">Nuevo atributos de activo</h1>
    <a href="javascript:history.back()" class="btn btn-outline-secondary btn-sm">Atrás</a>
  </div>

  <form method="post" class="card p-3">
    {% csrf_token %}
    <div class="mb-3">
      <label class="form-label">Tipo de activo</label>
      <select name="tipo_id" class="form-select" required>
        <option value="">— Selecciona —</option>
        {% for t in tipos %}
          <option value="{{ t.id_tipo_activo }}">{{ t.tipo_activo }}</option>
        {% endfor %}
      </select>
    </div>

    <p class="text-muted small mb-3">
      Al continuar, podrás añadir varias parejas <strong>Atributo / Valor</strong> para ese tipo (igual que en “Editar atributos”).
    </p>

    <div class="d-flex gap-2">
      <button type="submit" class="btn btn-primary">Continuar</button>
      <a href="{% url 'productos:atributosactivos_list' %}" class="btn btn-light">Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}
